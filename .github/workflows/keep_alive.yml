name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '0 */4 * * *' # This triggers the script automatically every 4 hours
  workflow_dispatch: # This allows you to manually test and run it anytime

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Streamlit
        uses: gpenessot/streamlit-keep-alive@v1
        with:
          app-url: 'https://delhi-bus-radar-5k2lnnxtaraakus3x4d9id.streamlit.app/' # <--- CHANGE THIS URL
